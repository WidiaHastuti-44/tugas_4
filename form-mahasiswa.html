<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIKA - Form Mahasiswa</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>SIKA</h1>
            <p>Sistem Informasi Akademik</p>
        </div>
    </header>

    <nav aria-label="Navigasi utama">
        <div class="container">
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="mahasiswa.html">Profil Mahasiswa</a></li>
                <li><a href="form-mahasiswa.html" aria-current="page">Form Mahasiswa</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="page-heading">
            <h2>Form Data Mahasiswa</h2>
            <p>Silakan isi data mahasiswa pada formulir berikut.</p>
        </section>

        <form id="FormMahasiswa" action="#" method="post" novalidate>

            <div class="form-row">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama">
                    <small id="errorNama" class="error-mesesage"></small>
                </div>

                <div class="form-group">
                    <label for="nim">NIM</label>
                    <input type="text" id="nim" name="nim">
                    <small id="errorNim" class="error-message"></small>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                    <small id="errorEmail" calss="error-message"></small>
                </div>
                <div class="form-group">
                    <label for="prodi">Program Studi</label>
                    <select id="prodi" name="prodi">
                        <option value="">-- Pilih Program Studi --</option>
                        <option value="IT">Teknik Informatika</option>
                        <option value="SI">Sistem Informasi</option>
                    </select>
                    <small id="errorProdi" class="error-message"></small>
                </div>
            </div>

            <div class="form-group">
                <label for="angkatan">Angkatan</label>
                <input type="number" id="angkatan" name="angkatan" required>
            </div>

            <fieldset>
                <legend>Status Akademik</legend>

                <div class="radio-group">
                    <label for="aktif">
                        <input type="radio" id="aktif" name="status" value="Aktif" required>
                        Aktif
                    </label>

                    <label for="nonaktif">
                        <input type="radio" id="nonaktif" name="status" value="Nonaktif">
                        Nonaktif
                    </label>
                </div>
            </fieldset>

            <div class="form-actions">
                <button type="submit">Simpan</button>
                <button type="reset" class="button-secondary">Reset</button>
            </div>

        </form>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 SIKA</p>
        </div>
    </footer>
    <script src="app.js" defer></script>
</body>

</html>
